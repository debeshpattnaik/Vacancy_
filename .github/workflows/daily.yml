name: Daily Legal Vacancy Tracker

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (no commits)'
        required: false
        type: boolean
      verbose:
        description: 'Verbose logging'
        required: false
        type: boolean

concurrency:
  group: daily-tracker
  cancel-in-progress: true

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tracker
        run: |
          python main.py
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERBOSE: ${{ inputs.verbose }}

      - name: Commit and Push data
        if: ${{ !inputs.dry_run }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/vacancies.db data/daily_report.md data/daily_report.html logs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update tracker data [skip ci]" && git push)

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Automated Tracker Run Failed',
              body: `The automated run failed on ${new Date().toISOString()}.\nCheck the [workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            })

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tracker-artifacts
          path: |
            data/daily_report.md
            data/daily_report.html
            logs/
