[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-vacancy-tracker"
version = "0.1.0"
description = "Industrial-grade legal vacancy tracker"
authors = [
    {name = "Author Name"}
]
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "html5lib>=1.1,<2",
    "urllib3>=2.0,<3",
    "rich>=13.0,<14",
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
    "python-dotenv>=1.0,<2"
]
requires-python = ">=3.9"

[project.scripts]
legal-vacancy-tracker = "app.tracker:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
